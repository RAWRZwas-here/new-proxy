<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Proxy</title>
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        .controls { padding: 10px; background: #2c3e50; color: white; display: flex; gap: 10px; }
        input[type="url"] { flex-grow: 1; padding: 8px; border: none; border-radius: 4px; }
        button { padding: 8px 16px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2980b9; }
        iframe { flex-grow: 1; border: none; width: 100%; background: white; }
        .error { color: #e74c3c; padding: 5px; display: none; }
    </style>
</head>
<body>
    <div class="controls">
        <input type="url" id="urlInput" placeholder="Enter URL (e.g., https://example.com)" value="">
        <button onclick="loadProxy()">Go</button>
    </div>
    <div id="errorMsg" class="error"></div>
    <iframe id="proxyFrame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>

    <script>
        const iframe = document.getElementById('proxyFrame');
        const errorMsg = document.getElementById('errorMsg');

        async function loadProxy() {
            let url = document.getElementById('urlInput').value;
            if (!url) return;
            
            // Ensure protocol
            if (!url.startsWith('http')) url = 'https://' + url;

            errorMsg.style.display = 'none';
            errorMsg.innerText = '';

            // Try different CORS proxies in order of reliability
            const proxies = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                `https://corsproxy.io/?${encodeURIComponent(url)}`,
                `https://api.codetabs.com/v1/proxy?request=${encodeURIComponent(url)}`
            ];

            let html = null;
            let lastError = "";

            for (const proxyUrl of proxies) {
                try {
                    const response = await fetch(proxyUrl);
                    if (response.ok) {
                        html = await response.text();
                        break; // Success! Stop trying other proxies.
                    }
                } catch (e) {
                    lastError = e.message;
                }
            }

            if (!html) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = `Failed to fetch from all proxies. Error: ${lastError}`;
                return;
            }

            // Inject base tag to fix relative links
            const baseTag = `<base href="${url}" target="_top">`;
            
            // Modify HTML to keep links inside the iframe
            let modifiedHtml = html.replace(/<a\b/gi, '<a target="_self" ');
            
            // Write to iframe
            iframe.srcdoc = baseTag + modifiedHtml;
        }

        // Load default page on start
        window.onload = () => {
            document.getElementById('urlInput').value = "https://www.wikipedia.org";
            loadProxy();
        };
    </script>
</body>
</html>
